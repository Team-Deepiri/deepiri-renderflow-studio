[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "deepiri-renderflow-model-workers"
version = "0.1.0"
description = "PyTorch model workers for Renderflow (Redis consumer)"
authors = ["Deepiri"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
redis = ">=5.0.0"
deepiri-renderflow-worker-queue = { path = "../../lib/renderflow_queue", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

# Optional LLM planner deps (§2.4). Install with: poetry install --with llm
# Kept optional so base installs and CI stay light (no compiled llama-cpp).
[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
llama-cpp-python = ">=0.3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `diri-agent-guardrails`: track `main`; `poetry lock` pins the commit. Bump with `poetry update diri-agent-guardrails`.
diri-agent-guardrails = { git = "https://github.com/Team-Deepiri/diri-agent-guardrails.git", branch = "main" }
