services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: renderflow
      POSTGRES_PASSWORD: renderflow
      POSTGRES_DB: renderflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renderflow
      MINIO_ROOT_PASSWORD: renderflowpass
    ports:
      - "9000:9000"
      - "9001:9001"

  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.orchestrator
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql://renderflow:renderflow@postgres:5432/renderflow
      REDIS_URL: redis://redis:6379/0
      RENDERFLOW_HTTP_HOST: 0.0.0.0
      RENDERFLOW_GRPC_HOST: 0.0.0.0
      RENDERFLOW_RFIR_ENABLED: "true"
    volumes:
      - ../../services/orchestrator/data/render_outputs:/app/services/orchestrator/data/render_outputs
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
