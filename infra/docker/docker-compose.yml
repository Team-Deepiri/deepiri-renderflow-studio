version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: renderflow
      POSTGRES_PASSWORD: renderflow
      POSTGRES_DB: renderflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renderflow
      MINIO_ROOT_PASSWORD: renderflowpass
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
