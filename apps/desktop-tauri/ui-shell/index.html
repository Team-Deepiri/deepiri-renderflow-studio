<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderflow Studio</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #141414; color: #f2f2f2; }
      .bar { padding: 10px 14px; background: #1f1f1f; border-bottom: 1px solid #303030; }
      .layout { display: grid; grid-template-columns: 260px 1fr 340px; grid-template-rows: 1fr 240px; height: calc(100vh - 42px); }
      .pane { border-right: 1px solid #2d2d2d; border-bottom: 1px solid #2d2d2d; padding: 12px; }
      .center { background: #0f0f0f; }
      .timeline { grid-column: 1 / 4; background: #171717; }
    </style>
  </head>
  <body>
    <div class="bar">Renderflow Studio - Native Shell</div>
    <div class="layout">
      <div class="pane">Asset Explorer</div>
      <div class="pane center">Program Monitor (Vulkan preview surface binding)</div>
      <div class="pane">AI Copilot (collapsible in manual mode)</div>
      <div class="pane timeline">Timeline + Keyframes + Mixer</div>
    </div>
  </body>
</html>
