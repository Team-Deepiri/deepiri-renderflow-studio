[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "deepiri-renderflow-worker-queue"
version = "0.1.0"
description = "In-repo Redis AI job queue helpers for Renderflow Studio (orchestrator + model workers)."
readme = "README.md"
authors = ["Deepiri"]
license = "MIT"
packages = [{ include = "renderflow_queue", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
