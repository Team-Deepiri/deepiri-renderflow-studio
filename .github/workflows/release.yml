name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config \
            fuse libfuse2 file python3 python3-pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop-tauri/ui/package-lock.json
            apps/desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-tauri/src-tauri
            core/timeline-engine-rs
            core/render-engine-vulkan

      - name: Build Linux AppImage
        run: bash scripts/ci/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/Renderflow-Studio-latest.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop-tauri/ui/package-lock.json
            apps/desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-tauri/src-tauri
            core/timeline-engine-rs
            core/render-engine-vulkan

      - name: Build macOS DMG
        run: bash scripts/ci/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/Renderflow-Studio-latest.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/desktop-tauri/ui/package-lock.json
            apps/desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-tauri/src-tauri
            core/timeline-engine-rs
            core/render-engine-vulkan

      - name: Build Windows installer
        run: bash scripts/ci/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Renderflow-Studio-latest-setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/linux/Renderflow-Studio-latest.AppImage
            artifacts/macos/Renderflow-Studio-latest.dmg
            artifacts/windows/Renderflow-Studio-latest-setup.exe
